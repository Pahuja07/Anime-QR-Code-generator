name: AniQR CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aniqr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test and API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest fastapi "uvicorn[standard]" python-dotenv razorpay runpod

      - name: Run unit tests
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Compile Python modules
        run: python -m compileall -q app.py runpod_handler.py src tests

  publish-images:
    name: Build and publish Docker images
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      worker_sha_image: ${{ steps.worker-ref.outputs.image }}
      api_sha_image: ${{ steps.api-ref.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define worker image tags
        id: worker-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-worker
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Save immutable worker image reference
        id: worker-ref
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}-worker:sha-${COMMIT_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push RunPod worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Define API image tags
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Save immutable API image reference
        id: api-ref
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}-api:sha-${COMMIT_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy-runpod:
    name: Roll out worker to RunPod
    needs: publish-images
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Update existing RunPod template image
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ vars.RUNPOD_TEMPLATE_ID }}
          WORKER_IMAGE: ${{ needs.publish-images.outputs.worker_sha_image }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ] || [ -z "$RUNPOD_TEMPLATE_ID" ]; then
            echo "RunPod deploy skipped: configure RUNPOD_API_KEY secret and RUNPOD_TEMPLATE_ID variable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "https://api.runpod.io/v2/templates/${RUNPOD_TEMPLATE_ID}" \
            --header "Authorization: Bearer ${RUNPOD_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg image "$WORKER_IMAGE" '{image: $image}')" \
            --output /dev/null

          echo "RunPod template ${RUNPOD_TEMPLATE_ID} updated to ${WORKER_IMAGE}." >> "$GITHUB_STEP_SUMMARY"
